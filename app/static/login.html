<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibte Pipeline — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0c0f24;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-container{width:100%;max-width:400px;padding:20px}
.login-card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:1.5rem;color:#38bdf8;margin-bottom:8px}
.logo p{color:#94a3b8;font-size:0.9rem}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;color:#94a3b8;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.5px}
.form-group input{width:100%;padding:12px 16px;background:#080c1a;border:1px solid #1e293b;border-radius:8px;color:#e2e8f0;font-size:1rem;transition:border-color 0.2s}
.form-group input:focus{outline:none;border-color:#38bdf8}
.form-group input::placeholder{color:#475569}
.btn-login{width:100%;padding:14px;background:#38bdf8;color:#0c0f24;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background 0.2s}
.btn-login:hover{background:#7dd3fc}
.btn-login:disabled{opacity:0.5;cursor:not-allowed}
.error{background:rgba(248,113,113,.1);border:1px solid #f87171;color:#f87171;padding:12px;border-radius:8px;margin-bottom:20px;font-size:0.9rem;display:none}
.error.show{display:block}
.footer{text-align:center;margin-top:24px;color:#475569;font-size:0.8rem}
</style>
</head>
<body>
<div class="login-container">
<div class="login-card">
<div class="logo">
<h1>Vibte TikTok Pipeline</h1>
<p>Sign in to continue</p>
</div>
<div class="error" id="error"></div>
<form id="loginForm">
<div class="form-group">
<label>Username</label>
<input type="text" id="username" name="username" required autofocus placeholder="admin">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="password" name="password" required placeholder="Password">
</div>
<button type="submit" class="btn-login" id="btnLogin">Sign In</button>
</form>
<div class="footer">Vibte Pipeline v1.0</div>
</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();
const btn = document.getElementById('btnLogin');
const err = document.getElementById('error');
btn.disabled = true;
btn.textContent = 'Signing in...';
err.classList.remove('show');
try {
const body = JSON.stringify({
username: document.getElementById('username').value,
password: document.getElementById('password').value
});
const res = await fetch('/api/auth/login', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: body
});
if (res.redirected) {
window.location.href = res.url;
} else if (res.ok) {
const data = await res.json();
if (data.redirect) window.location.href = data.redirect;
} else {
const data = await res.json();
err.textContent = data.detail || 'Login failed';
err.classList.add('show');
}
} catch (e) {
err.textContent = 'Connection error';
err.classList.add('show');
} finally {
btn.disabled = false;
btn.textContent = 'Sign In';
}
});
</script>
</body>
</html>
